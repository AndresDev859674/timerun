name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc

    - name: Build TimeRun Suite
      run: make

    - name: Verify Binaries
      run: |
        ./timerun --help || ./timerun -h
        ./timeeye --help || ./timeeye -h

    - name: Test Installation Rule
      run: |
        sudo make install
